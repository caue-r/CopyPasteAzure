<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CopyPasteAzure</title>
  <style>
    body { width: 420px; margin: 0; padding: 12px; font: 13px "Segoe UI", system-ui, sans-serif; color: #201f1e; }
    form { display: flex; gap: 6px; margin-bottom: 8px; }
    input { flex: 1; padding: 6px 8px; border: 1px solid #8a8886; border-radius: 3px; font: inherit; }
    button { padding: 6px 12px; border: 0; border-radius: 3px; background: #0078d4; color: #fff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #106ebe; }
    button.secondary { background: #edebe9; color: #201f1e; }
    #status { min-height: 18px; margin-bottom: 6px; }
    #status.ok { color: #107c10; }
    #status.err { color: #a4262c; }
    textarea { width: 100%; height: 300px; box-sizing: border-box; font: 12px Consolas, monospace; resize: vertical; }
    .actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  </style>
</head>
<body>
  <form id="form">
    <input id="id" type="text" inputmode="numeric" pattern="\d+" placeholder="ID do work item" autocomplete="off">
    <button type="submit">Copiar</button>
  </form>
  <div id="status"></div>
  <textarea id="preview" readonly placeholder="O texto copiado aparece aqui."></textarea>
  <div class="actions"><button id="again" class="secondary" type="button">Copiar novamente</button></div>
  <script src="popup.js"></script>
</body>
</html>
